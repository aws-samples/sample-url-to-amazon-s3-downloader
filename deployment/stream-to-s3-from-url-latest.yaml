  AWS::CloudFormation::Interface:
    ParameterGroups:


      -
        Label:
          default: "Source URL"
        Parameters:
          - SourceRootURL    

      -
        Label:
          default: "Your Production Amazon S3 Bucket name"
        Parameters:
          - YourProductionS3Bucket       


      -
        Label:
          default: "Storage Class for Storing the Objects in Amazon S3"
        Parameters:
          - StorageClass             
          

      -
        Label:
          default: "AWS SDK Performance, Function, Retry and Parameters for Copying"
        Parameters:
          - S3SDKChecksumType
          - SDKThroughput
          - SDKMaxErrorRetries
          - MultipartThreshold
          - MultipartChunkSize           
          - CopyFunctionReservedConcurrency
          - LambdaMemory



 
          
    ParameterLabels:
      SourceRootURL:
        default: "The root URL where the files will be downloaded from, without the trailing /"
      S3SDKChecksumType:
        default: "The type of checksum AWS SDK will use to validate the integrity of the upload to Amazon S3"
      SDKThroughput:
        default: "The number of concurrent connections the AWS SDK will use to perform the transfer to Amazon S3"
      SDKMaxErrorRetries:
        default: "The number of times the AWS SDK will retry failed uploads attempts"
      MultipartThreshold:
        default: "AWS SDK will switch to chunked uploads (multipart) for objects greater than this size"
      MultipartChunkSize:
        default: "AWS SDK will use this chunk size for chunked uploads (multiparts)"
      CopyFunctionReservedConcurrency:
        default: "The maximum number of concurrent lambda functions that will be invoked for the transfer. Default is >= 1,000"
      StorageClass:
        default: "Choose the destination Amazon S3 storage class for your data. Storage classes determine retrieval, cost and performance"
      YourProductionS3Bucket:
        default: "The name of your Amazon S3 Bucket where you want the data to be stored. Deploy this stack in the same region as your bucket"
      LambdaMemory:
        default: "The amount of memory in GB assigned to the copy Lambda function"

                                                                       


Parameters:

  YourProductionS3Bucket:
    Type: String


  SourceRootURL:
    Type: String


  LambdaMemory:
    Description: The amount of memory assigned to the copy Lambda function
    Type: Number
    MinValue: 512
    MaxValue: 1024
    Default: 648
    ConstraintDescription: Function memory Value must be within the range of 512 to 1024


  SDKMaxErrorRetries:
    Description: The number of SDK error retries
    Type: Number
    MinValue: 5
    MaxValue: 100
    Default: 30
    ConstraintDescription: SDK Retries Value must be within the range of 5 to 100

  SDKThroughput:
    Description: The maximum number of connections SDK keeps in a connection pool and the maximum number of concurrent requests SDK uses
    Type: Number
    MinValue: 1
    MaxValue: 10    
    Default: 1
    ConstraintDescription: Concurrent Requests Value must be a Valid Integer and within the range of 10 to 940    

  MultipartThreshold:
    Description: Multipart Threshold size in bytes (MB*1024*1024) when the SDK switches to multipart transfers.
    Type: Number
    Default: 104857600
    MinValue: 8388608
    MaxValue: 104857600
    AllowedValues:
      - 8388608
      - 16777216
      - 104857600      
    ConstraintDescription: Multipart Threshold size Value must be a Valid Integer!
  
  
  MultipartChunkSize:
    Description: Multipart Chunk in bytes (MB*1024*1024), when SDK switches to Multipart transfers
    Type: Number
    Default: 8388608
    MinValue: 5242880
    MaxValue: 16777216
    AllowedValues:
      - 5242880
      - 8388608
      - 16777216       
    ConstraintDescription: Multipart Chunk Value must be a Valid Integer!
      


  CopyFunctionReservedConcurrency:
    Description: Choose Unreserved to allow S3 Batch utilize up to 1,000 concurrency, or optionally specify the reserved concurrency for the Lambda function S3 Batch Operations Invokes to perform Copy operations. Note, setting a value impacts the concurrency pool available to other functions. 
    Type: String
    Default: Unreserved
    ConstraintDescription: Value must be within the range of 0 to 200
    AllowedValues:
      - Unreserved
      - 200
      - 150
      - 100
      - 50
      - 10
      - 5
      - 2


  S3SDKChecksumType:
    AllowedValues:
      - CRC32
      - SHA1
      - SHA256
    Description: Please Choose the Checksum type you want Boto3 SDK to use for verfying the data. Choose CRC for faster performance or SHA for better security
    Default: CRC32
    Type: String   

  StorageClass:
    AllowedValues:
      - STANDARD
      - STANDARD_IA
      - ONEZONE_IA
      - INTELLIGENT_TIERING
      - GLACIER_IR
    Description: Please Choose your desired S3 Storage-Class for the Object Copy
    Default: STANDARD
    Type: String      


Conditions:
     NoFunctionConcurrency: !Equals [!Ref CopyFunctionReservedConcurrency, Unreserved]



Resources:

################################### Stack Name to Lower Case ##################################################

  StackNametoLower:
    Type: Custom::NametoLower
    Properties:
      ServiceToken: !GetAtt NametoLower.Arn
      stackname: !Ref AWS::StackName    


  NametoLowerIAMRole:
    DependsOn:
      - CheckBucketExists  
    Type: AWS::IAM::Role
    Properties:
      Policies:
        - PolicyName: AWSLambdaBasicExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'                  
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Effect: Allow       
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"


  NametoLower:
    DependsOn:
      - CheckBucketExists  
    Type: 'AWS::Lambda::Function'
    Properties:
      Architectures:
        - arm64
      Description: Enforces Lower case for Stackname
      MemorySize: 128
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt NametoLowerIAMRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import cfnresponse


          def lambda_handler(event, context):
              to_lower = event['ResourceProperties'].get('stackname', '').lower()
              responseData = dict(change_to_lower=to_lower)
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)


####################################### Code Ends ###########################################


################################ CheckBucketExists ######################################################


  CheckBucketExists:
    Type: 'Custom::LambdaTrigger'
    Properties:
      ServiceToken: !GetAtt CheckBucketExistsLambdaFunction.Arn
      bucketexists: !Ref YourProductionS3Bucket

  
  CheckBucketExistsIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:  
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: AWSLambdaBasicExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'                  
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Effect: Allow       
        - PolicyName: Permissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetBucketLocation'
                Resource: 
                - !Sub arn:${AWS::Partition}:s3:::${YourProductionS3Bucket}


  CheckBucketExistsLambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Architectures:
        - arm64
      Handler: index.lambda_handler
      Role: !GetAtt CheckBucketExistsIAMRole.Arn
      Runtime: python3.11
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
            import json
            import cfnresponse
            import logging
            import os
            import boto3
            from botocore.exceptions import ClientError
            from botocore.client import Config

            # Enable debugging for troubleshooting
            # boto3.set_stream_logger("")


            # Set up logging
            logger = logging.getLogger(__name__)
            logger.setLevel('INFO')


            # Define Environmental Variables
            my_region = str(os.environ['AWS_REGION'])


            # Set SDK paramters
            config = Config(retries = {'max_attempts': 5})

            # Set variables
            # Set Service Parameters
            s3Client = boto3.client('s3', config=config, region_name=my_region)


            def check_bucket_exists(bucket):
                logger.info(f"Checking if the S3 Bucket Exists")
                try:
                    check_bucket = s3Client.get_bucket_location(
                        Bucket=bucket,
                    )
                except ClientError as e:
                    logger.error(e)
                    raise
                else:
                    logger.info(f"Bucket {bucket}, exists, proceeding with deployment ...")
                    return check_bucket            


            def lambda_handler(event, context):
              # Define Environmental Variables
              s3Bucket  = event.get('ResourceProperties').get('bucketexists')

              logger.info(f'Event detail is: {event}')

              if event.get('RequestType') == 'Create' or event.get('RequestType') == 'Update':
                # logger.info(event)
                try:
                  logger.info("Stack event is Create, checking if the S3 Bucket exists...")
                  check_bucket_exists(s3Bucket)
                  responseData = {}
                  responseData['message'] = "Successful"
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                except Exception as e:
                  logger.error(e)
                  responseData = {}
                  responseData['message'] = str(e)
                  failure_reason = str(e) 
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData, reason=failure_reason)


              elif event.get('RequestType') == 'Delete' :
                # logger.info(event)
                try:
                  logger.info(f"Stack event is Delete, nothing to do....")
                  responseData = {}
                  responseData['message'] = "Completed"
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                except Exception as e:
                  logger.error(e)
                  responseData = {}
                  responseData['message'] = str(e)
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData)                  


################################################ Code Ends ####################################################

################################################# Support Tool S3 Bucket #############################################
              

  ToolBucket:
    DependsOn:
      - CheckBucketExists
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'url-to-s3-${AWS::AccountId}-${AWS::Region}-${StackNametoLower.change_to_lower}' 
      LifecycleConfiguration:
        Rules:
          - Id: delete-incomplete-mpu-expired-delete
            Prefix: ''
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Status: Enabled
          - Id: ExpirationRule
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
                NoncurrentDays: 1


############################### S3 Batch Operations IAM Role ##############################


  S3BatchOperationsServiceIamRole:
    DependsOn:
      - CheckBucketExists 
    Type: 'AWS::IAM::Role'
    Properties:
      Policies:
        - PolicyName: S3BatchOperationsServiceIamRolePolicy0
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:GetBucketLocation'
                  - 's3:PutObject'
                  - 's3:PutObjectAcl'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::url-to-s3-${AWS::AccountId}-${AWS::Region}-${StackNametoLower.change_to_lower}
                  - !Sub arn:${AWS::Partition}:s3:::url-to-s3-${AWS::AccountId}-${AWS::Region}-${StackNametoLower.change_to_lower}/*
                Effect: Allow
              - Action:
                  - 'lambda:InvokeFunction'
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${S3BatchCopyLambdafunction}*'
                Effect: Allow
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: batchoperations.s3.amazonaws.com
            Action: 'sts:AssumeRole'



###############################################################################################



  S3BatchCopyLambdaFunctionIamRole:
    DependsOn:
      - CheckBucketExists     
    Type: 'AWS::IAM::Role'
    Properties:
      Policies:
        - PolicyName: AWSLambdaBasicExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'                  
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Effect: Allow      
        - PolicyName: S3BatchCopyLambdaFunctionIamRolePolicy0
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 's3:GetObject'
                  - 's3:GetObjectAcl'
                  - 's3:GetObjectTagging'
                  - 's3:GetObjectVersion'
                  - 's3:GetObjectVersionAcl'
                  - 's3:GetObjectVersionTagging'
                  - 's3:ListBucket*'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${YourProductionS3Bucket}
                  - !Sub arn:${AWS::Partition}:s3:::${YourProductionS3Bucket}/*
                Effect: Allow
              - Action:
                  - 's3:PutObject'
                  - 's3:PutObjectAcl'
                  - 's3:PutObjectTagging'
                  - 's3:GetBucketLocation'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${YourProductionS3Bucket}
                  - !Sub arn:${AWS::Partition}:s3:::${YourProductionS3Bucket}/*
                Effect: Allow
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'


  S3BatchCopyLambdafunction:
    DependsOn:
      - CheckBucketExists     
    Type: 'AWS::Lambda::Function'
    Properties:
      Architectures:
        - arm64     
      ReservedConcurrentExecutions: 
        !If [NoFunctionConcurrency, !Ref AWS::NoValue, !Ref CopyFunctionReservedConcurrency ]    
      Environment:
        Variables:
          root_url: !Ref SourceRootURL
          my_account_id: !Sub ${AWS::AccountId}
          max_attempts: !Ref SDKMaxErrorRetries
          copy_storage_class: !Ref StorageClass
          max_concurrency: !Ref SDKThroughput
          max_pool_connections: !Ref SDKThroughput
          multipart_chunksize: !Ref MultipartChunkSize
          multipart_threshold: !Ref MultipartThreshold
          checksum_type: !Ref S3SDKChecksumType          
      Runtime: python3.12
      Timeout: 900
      Description: An S3 Batch Solution for Copying objects from URL to Amazon S3 Bucket
      MemorySize: !Ref LambdaMemory
      Handler: index.lambda_handler
      Role: !GetAtt
        - S3BatchCopyLambdaFunctionIamRole
        - Arn
      Code:
        ZipFile: |
            from urllib.request import urlopen
            import boto3
            import io
            import json
            import logging
            import uuid
            import os
            from urllib import parse
            from botocore.client import Config
            from botocore.exceptions import ClientError as S3ClientError
            from botocore.exceptions import ClientError
            from boto3.s3.transfer import TransferConfig            
            import datetime      

            # # Set up logging
            logger = logging.getLogger(__name__)
            logger.setLevel('INFO')

            # Enable Verbose logging for Troubleshooting
            # boto3.set_stream_logger("")                  

            # Define Environmental Variables
            my_root_url = str(os.environ['root_url'])
            my_max_attempts = int(os.environ['max_attempts'])
            my_max_pool_connections = int(os.environ['max_pool_connections'])
            my_max_concurrency = int(os.environ['max_concurrency'])            
            my_region = str(os.environ['AWS_REGION'])
            obj_copy_storage_class = str(os.environ['copy_storage_class'])
            my_multipart_chunksize = int(os.environ['multipart_chunksize'])
            my_multipart_threshold = int(os.environ['multipart_threshold'])
            my_checksum_type = str(os.environ['checksum_type'])                 


            # Set and Declare Configuration Parameters
            upload_transfer_config = TransferConfig(max_concurrency=my_max_concurrency,
                                                    multipart_chunksize=my_multipart_chunksize,
                                                    multipart_threshold=my_multipart_threshold,
                                                    )
            config = Config(max_pool_connections=my_max_pool_connections, retries={'max_attempts': my_max_attempts})

            # Set and Declare Copy Arguments
            my_upload_args = {'ACL': 'bucket-owner-full-control', 'StorageClass': obj_copy_storage_class, 'ChecksumAlgorithm' : my_checksum_type}

            # Set Service Clients
            s3 = boto3.resource('s3', config=config, region_name=my_region)

            # Stream Downloaded file from URL to Support Tool Amazon S3 Bucket
            def stream_to_s3(url, bucket, key):
                logger.info(f'Starting the streaming of object in URL to the S3 Bucket: s3://{bucket}/{key}')
                try:
                    with urlopen(url) as inv_stream:
                        s3.Object(bucket, key).upload_fileobj(inv_stream,
                                                              Config=upload_transfer_config,
                                                              ExtraArgs=my_upload_args,
                                                              )                                        
                except Exception as e:
                    logger.error(e)
                    raise e
                else:
                    logger.info(f'Object successfully uploaded to s3://{bucket}/{key}')
          


            def lambda_handler(event, context):
              # Parse job parameters from Amazon S3 batch operations
              jobId = event['job']['id']
              invocationId = event['invocationId']
              invocationSchemaVersion = event['invocationSchemaVersion']

              # Prepare results
              results = []

              # Parse Amazon S3 Key, Key Version, and Bucket ARN
              taskId = event['tasks'][0]['taskId']
              # use unquote_plus to handle various characters in S3 Key name
              s3Key = parse.unquote_plus(event['tasks'][0]['s3Key'], encoding='utf-8')
              s3BucketArn = str(event['tasks'][0]['s3BucketArn'])
              s3Bucket = s3BucketArn.split(':')[-1]
              # Create assest full url path
              url_path = parse.quote(s3Key)
              my_asset_url = f"{my_root_url}/{url_path}"
              logger.info(f"My full URL path is {my_asset_url}")              

              try:
                # Prepare result code and string
                resultCode = None
                resultString = None
                # Remove line feed or carriage return for compatibility with S3 Batch Result Message
                # Will use str.translate to strip '\n' and '\r'. Convert both char to ascii using ord()
                # where '\t' = 9, '\n' = 10 and '\r' = 13
                mycompat = {9: None, 10: None, 13: None}

                # Initialize response to Batch Operations

                # Initialize Stream from URL and upload to Amazon S3 Bucket
                stream_to_s3(my_asset_url, s3Bucket, s3Key)                
                # Mark as succeeded
                resultCode = 'Succeeded'
                resultString = str("Successfully completed the copy process!")                

              except Exception as e:
                # log errors, some errors does not have a response, so handle them
                logger.error(f"Unable to complete requested operation, see Additional Client/Service error details below:")
                try:
                  logger.error(e.response)
                  errorCode = e.response.get('Error', {}).get('Code')
                  errorMessage = e.response.get('Error', {}).get('Message')
                  errorS3RequestID = e.response.get('ResponseMetadata', {}).get('RequestId')
                  errorS3ExtendedRequestID = e.response.get('ResponseMetadata', {}).get('HostId')
                  resultString = '{}: {}: {}: {}'.format(errorCode, errorMessage, errorS3RequestID, errorS3ExtendedRequestID)
                except AttributeError:
                  logger.error(e)
                  resultString = 'Exception: {}'.format(str(e).translate(mycompat))
                resultCode = 'PermanentFailure'

              finally:
                results.append({
                'taskId': taskId,
                'resultCode': resultCode,
                'resultString': resultString
                })

              return {
              'invocationSchemaVersion': invocationSchemaVersion,
              'treatMissingKeysAs': 'PermanentFailure',
              'invocationId': invocationId,
              'results': results
              }




############################################# Outputs #################################

Outputs:
  YourProductionBucketName:
    Value: !Ref YourProductionS3Bucket 
    Description: The S3 Bucket where the solution will copy the objects to 
  ManifestandReportBucketName:
    Description: Solution Amazon S3 Bucket to Upload Manifest and Access Batch Operations Job Reports.
    Value: !Ref ToolBucket 
  BatchCopyLambdaARN:
    Description: ARN of the Lambda function S3 Batch Operation Invokes
    Value: !GetAtt S3BatchCopyLambdafunction.Arn  
  S3BatchServiceIAMRoleARN:
    Description: ARN of the IAM role Amazon S3 Batch Operations uses to invoke the Lambda function
    Value: !GetAtt S3BatchOperationsServiceIamRole.Arn
